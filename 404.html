<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Stackly Foundation</title>
<meta name="robots" content="noindex">
<link rel="icon" href="stackly-logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{
    --header:#0F5C5C;
    --hero-1:#0F5C5C;
    --hero-2:#159A8C;
    --btn:#2E7D4F;
    --btn-hover:#23663E;
    --bg:#FFF8ED;
    --bg-alt:#EAF4EC;
    --accent:#F28C7A;
    --card:#FFFFFF;
    --ink:#1E2B26;
    --ink-soft:#5A6B63;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Manrope',sans-serif;
    background:var(--bg);
    color:var(--ink);
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  a{text-decoration:none;color:inherit;}

  /* ===== BACKDROP ===== */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .blob{position:absolute;border-radius:50%;filter:blur(2px);}
  .blob.b1{width:520px;height:520px;left:-160px;top:-160px;background:radial-gradient(circle at 30% 30%,#159A8C33,#0F5C5C10);}
  .blob.b2{width:420px;height:420px;right:-120px;bottom:-140px;background:radial-gradient(circle at 60% 40%,#F28C7A40,#F28C7A10);}
  .blob.b3{width:260px;height:260px;right:14%;top:8%;background:radial-gradient(circle at 40% 40%,#2E7D4F22,#2E7D4F08);}
  .dot{position:absolute;border-radius:50%;background:var(--hero-2);opacity:.25;}
  .ring{position:absolute;border-radius:50%;border:2px dashed rgba(15,92,92,.18);}

  /* ===== CONTENT ===== */
  .wrap{
    position:relative;z-index:2;
    width:100%;max-width:720px;padding:32px 24px;
    text-align:center;
  }
  .code{
    display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,18px);
    font-family:'Fraunces',serif;font-weight:700;line-height:1;
    font-size:clamp(96px,22vw,210px);
    color:var(--header);
    margin-bottom:6px;
  }
  .code .d{display:inline-block;will-change:transform,opacity;}
  .code .d.four,.code .d.zero{background:linear-gradient(160deg,var(--hero-1),var(--hero-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .orb{
    position:relative;display:inline-block;
    width:.78em;height:.78em;border-radius:50%;
    background:linear-gradient(150deg,var(--hero-1),var(--hero-2));
    box-shadow:0 18px 40px rgba(15,92,92,.3), inset 0 -10px 24px rgba(0,0,0,.15);
    will-change:transform,opacity;
  }
  .orb::after{
    content:"";position:absolute;inset:-12px;border-radius:50%;
    border:2px dashed rgba(242,140,122,.85);
    animation:spin 14s linear infinite;
  }
  .orb svg{position:absolute;inset:0;margin:auto;width:56%;height:56%;}
  .needle{transform-origin:50% 50%;animation:wobble 4.2s ease-in-out infinite;}

  .eyebrow{
    text-transform:uppercase;letter-spacing:3px;font-size:13px;font-weight:700;
    color:var(--btn);display:inline-flex;align-items:center;gap:10px;margin-bottom:14px;
  }
  .eyebrow::before,.eyebrow::after{content:"";width:28px;height:2px;background:var(--accent);display:inline-block;}
  h1{
    font-family:'Fraunces',serif;font-weight:600;
    font-size:clamp(28px,4.6vw,44px);line-height:1.15;margin-bottom:14px;
  }
  h1 em{font-style:italic;color:var(--accent);}
  p.lead{color:var(--ink-soft);font-size:17px;line-height:1.7;max-width:520px;margin:0 auto 34px;}

  .actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:15px 32px;border-radius:40px;font-weight:700;font-size:15px;
    cursor:pointer;font-family:'Manrope',sans-serif;
    transition:transform .35s ease, box-shadow .35s ease, background .35s ease, color .35s ease, border-color .35s ease;
    position:relative;overflow:hidden;
  }
  .btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s ease;}
  .btn-outline{background:transparent;color:var(--header);border:2px solid var(--header);}
  .btn-outline:hover{background:var(--header);color:#fff;transform:translateY(-3px);box-shadow:0 12px 24px rgba(15,92,92,.25);}
  .btn-outline:hover svg{transform:translateX(-4px);}
  .btn-primary{background:var(--btn);color:#fff;border:2px solid var(--btn);}
  .btn-primary:hover{background:var(--btn-hover);border-color:var(--btn-hover);transform:translateY(-3px);box-shadow:0 12px 24px rgba(46,125,79,.35);}
  .btn-primary:hover svg{transform:scale(1.15);}
  .btn:active{transform:translateY(-1px) scale(.98);}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset: 3px;}

  /* ===== PAGE TRANSITION CURTAIN ===== */
  .curtain{
    position:fixed;inset:0;z-index:50;background:var(--header);
    transform:translateY(100%);pointer-events:none;
    border-radius:50% 50% 0 0 / 12% 12% 0 0;
  }

  /* ===== KEYFRAMES ===== */
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes wobble{0%,100%{transform:rotate(-28deg);}25%{transform:rotate(32deg);}50%{transform:rotate(-14deg);}75%{transform:rotate(22deg);}}

  /* No-JS / no-GSAP fallback: gentle CSS entrance */
  .no-gsap .anim{animation:fadeUp .8s ease both;}
  .no-gsap .anim:nth-child(2){animation-delay:.15s;}
  .no-gsap .anim:nth-child(3){animation-delay:.3s;}
  .no-gsap .anim:nth-child(4){animation-delay:.45s;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:none;}}

  @media (prefers-reduced-motion:reduce){
    .orb::after,.needle{animation:none;}
  }
  @media (max-width:480px){
    .btn{width:100%;justify-content:center;}
    .actions{flex-direction:column;}
  }
</style>
<style id="preloader-css">
  .preloader{position:fixed;inset:0;z-index:99999;background:#0F5C5C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s ease;}
  .preloader.hide{opacity:0;pointer-events:none;}
  .preloader img{height:46px;width:auto;border-radius:0;filter:brightness(0) invert(1);animation:none;}
  .preloader .pl-line{width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;}
  .preloader .pl-line span{display:block;height:100%;width:0;border-radius:3px;background:#F28C7A;animation:plFill 1s cubic-bezier(.4,0,.2,1) forwards;}
  @keyframes plFill{to{width:100%;}}
  @media (prefers-reduced-motion:reduce){.preloader{transition:none;}.preloader .pl-line span{animation-duration:.01s;}}
</style>
</head>
<body>
<div class="preloader" id="preloader" role="status" aria-live="polite" aria-label="Loading"><img src="stackly-logo.webp" alt=""><div class="pl-line"><span></span></div></div>
<script>
(function(){
  var pre=document.getElementById('preloader'); if(!pre) return;
  document.body.style.overflow='hidden';
  var start=Date.now(), closed=false;
  function close(){
    if(closed) return; closed=true;
    pre.classList.add('hide'); document.body.style.overflow='';
    setTimeout(function(){ pre.style.display='none'; },550);
  }
  function ready(){ setTimeout(close, Math.max(0,1000-(Date.now()-start))); }
  if(document.readyState==='complete') ready(); else window.addEventListener('load',ready);
  setTimeout(close,4000); /* safety fallback */
})();
</script>


<div class="bg" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="ring" style="width:340px;height:340px;left:6%;bottom:8%;"></span>
  <span class="ring" style="width:220px;height:220px;right:8%;top:22%;"></span>
  <span class="dot" style="width:14px;height:14px;left:18%;top:26%;"></span>
  <span class="dot" style="width:10px;height:10px;left:78%;top:64%;background:var(--accent);"></span>
  <span class="dot" style="width:18px;height:18px;left:64%;top:14%;"></span>
  <span class="dot" style="width:9px;height:9px;left:30%;top:78%;background:var(--btn);"></span>
  <span class="dot" style="width:12px;height:12px;left:88%;top:40%;"></span>
</div>

<main class="wrap">
  <div class="code anim" aria-label="404" role="img">
    <span class="d four">4</span>
    <span class="d zero" id="orb">0</span>
    <span class="d four">4</span>
  </div>

  <div class="anim"><span class="eyebrow">Error 404</span></div>
  <h1 class="anim">Oops! This page took a <em>wrong turn</em>.</h1>
  <p class="lead anim">The page you're looking for may have moved, been renamed, or never existed. Let's get you back on the right path.</p>

  <div class="actions anim">
    <button type="button" class="btn btn-outline" id="goBack">
      <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
      Go Back
    </button>
    <a href="index.html" class="btn btn-primary" id="goHome">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      Back to Home
    </a>
  </div>
</main>

<div class="curtain" id="curtain"></div>

<script>
(function(){
  var curtain = document.getElementById('curtain');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Page-leave transition, then navigate ---------- */
  function leave(go){
    if(reduce || typeof gsap === 'undefined'){ go(); return; }
    gsap.fromTo(curtain, {yPercent:100}, {yPercent:0, duration:.6, ease:'power3.inOut', onComplete:go});
  }

  document.getElementById('goBack').addEventListener('click', function(){
    leave(function(){
      if(window.history.length > 1){ window.history.back(); }
      else { window.location.href = 'index.html'; }
    });
  });

  document.getElementById('goHome').addEventListener('click', function(e){
    e.preventDefault();
    var href = this.getAttribute('href');
    leave(function(){ window.location.href = href; });
  });

  /* If user returns via browser back/forward cache, reset the curtain */
  window.addEventListener('pageshow', function(ev){
    if(ev.persisted && typeof gsap !== 'undefined'){ gsap.set(curtain, {yPercent:100}); }
  });

  /* ---------- Entrance animation ---------- */
  if(typeof gsap === 'undefined'){
    document.documentElement.classList.add('no-gsap');
    return;
  }
  gsap.set(curtain, {yPercent:100});
  if(reduce) return;

  var fours = document.querySelectorAll('.d.four');
  var orb = document.getElementById('orb');
  var tl = gsap.timeline({defaults:{ease:'power3.out'}});

  tl.from(fours[0], {x:-120, opacity:0, rotate:-14, duration:1})
    .from(fours[1], {x:120, opacity:0, rotate:14, duration:1}, '<')
    .from(orb, {scale:0, opacity:0, rotate:-180, duration:1.1, ease:'back.out(1.7)'}, '-=.7')
    .from('.eyebrow', {y:20, opacity:0, duration:.6}, '-=.4')
    .from('h1', {y:30, opacity:0, duration:.7}, '-=.35')
    .from('.lead', {y:24, opacity:0, duration:.7}, '-=.5')
    .from('.actions .btn', {y:28, opacity:0, scale:.92, duration:.6, stagger:.14, ease:'back.out(1.6)'}, '-=.45');

  /* ---------- Ambient motion ---------- */
  gsap.to('.blob.b1', {x:60, y:40, duration:9, repeat:-1, yoyo:true, ease:'sine.inOut'});
  gsap.to('.blob.b2', {x:-50, y:-40, duration:11, repeat:-1, yoyo:true, ease:'sine.inOut'});
  gsap.to('.blob.b3', {x:-30, y:50, duration:8, repeat:-1, yoyo:true, ease:'sine.inOut'});
  gsap.utils.toArray('.dot').forEach(function(d,i){
    gsap.to(d, {y:'+='+gsap.utils.random(-30,30), x:'+='+gsap.utils.random(-20,20),
      duration:gsap.utils.random(3,6), repeat:-1, yoyo:true, ease:'sine.inOut', delay:i*.2});
  });
  gsap.to('.ring', {rotate:360, duration:40, repeat:-1, ease:'none'});
  gsap.to(orb, {y:-12, duration:2.4, repeat:-1, yoyo:true, ease:'sine.inOut', delay:1.6});

  /* ---------- Subtle mouse parallax on the digits ---------- */
  var code = document.querySelector('.code');
  window.addEventListener('mousemove', function(e){
    var x = (e.clientX / window.innerWidth - .5), y = (e.clientY / window.innerHeight - .5);
    gsap.to(code, {x:x*18, y:y*12, duration:.8, ease:'power2.out', overwrite:'auto'});
    gsap.to('.bg', {x:-x*20, y:-y*14, duration:1.2, ease:'power2.out', overwrite:'auto'});
  });
})();
</script>
</body>
</html>
